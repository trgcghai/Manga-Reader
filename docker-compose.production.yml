services:
  backend:
    build:
      context: ./backend
      target: runtime
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: runtime
      args:
        VITE_API_URL: ${VITE_API_URL}
    environment:
      NODE_ENV: production
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    depends_on:
      - backend
    restart: unless-stopped
