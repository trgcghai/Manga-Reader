services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "4002:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "4003:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: manga
      MONGO_INITDB_ROOT_PASSWORD: manga
      MONGO_INITDB_DATABASE: manga_reader
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "4004:5432"
    environment:
      POSTGRES_USER: manga
      POSTGRES_PASSWORD: manga
      POSTGRES_DB: manga_reader
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manga -d manga_reader"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "4005:9000"
      - "4006:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "4001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      REDIS_URL: redis://redis:6379
      MONGODB_URI: mongodb://manga:manga@mongodb:27017/manga_reader?authSource=admin
      DATABASE_URL: postgresql://manga:manga@postgres:5432/manga_reader
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: manga
      DB_PASSWORD: manga
      DB_NAME: manga_reader
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_URL: http://localhost:4005
      STORAGE_REGION: us-east-1
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: manga-pages
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      mongodb:
        condition: service_started
    command: npm run start:dev
    init: true

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "4000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      VITE_API_URL: http://localhost:4001
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
    init: true

volumes:
  redis-data:
  mongodb-data:
  mongodb-config:
  postgres-data:
  minio-data:
