services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: manga
      MONGO_INITDB_ROOT_PASSWORD: manga
      MONGO_INITDB_DATABASE: manga_reader
    volumes:
      - mongodb-data:/data/db
      - mongodb-config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: manga
      POSTGRES_PASSWORD: manga
      POSTGRES_DB: manga_reader
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manga -d manga_reader"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
      WATCHPACK_POLLING: "true"
      WATCHPACK_POLLING_INTERVAL: 1000
      REDIS_URL: redis://redis:6379
      MONGODB_URI: mongodb://manga:manga@mongodb:27017/manga_reader?authSource=admin
      DATABASE_URL: postgresql://manga:manga@postgres:5432/manga_reader
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    depends_on:
      - redis
      - mongodb
      - postgres
    command: npm run start:dev

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 500
      VITE_API_URL: http://localhost:3001
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  redis-data:
  mongodb-data:
  mongodb-config:
  postgres-data:
  backend-node-modules:
  frontend-node-modules:
