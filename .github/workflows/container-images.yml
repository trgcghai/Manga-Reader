name: Build, scan, and publish container images

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-scan:
    name: Build and scan images
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Require frontend API URL
        shell: bash
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: |
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Set the VITE_API_URL repository variable before building the frontend image."
            exit 1
          fi

      - name: Build backend runtime image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: runtime
          load: true
          tags: local/manga-reader-backend:${{ github.sha }}

      - name: Build frontend runtime image
        uses: docker/build-push-action@v7.4.0
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runtime
          load: true
          tags: local/manga-reader-frontend:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/manga-reader-backend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/manga-reader-frontend:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          vuln-type: os,library
          ignore-unfixed: false

      - name: Save scanned images
        run: >-
          docker save
          --output "$RUNNER_TEMP/images.tar"
          "local/manga-reader-backend:${GITHUB_SHA}"
          "local/manga-reader-frontend:${GITHUB_SHA}"

      - name: Upload scanned images
        uses: actions/upload-artifact@v7.0.2
        with:
          name: scanned-container-images
          path: ${{ runner.temp }}/images.tar
          if-no-files-found: error
          retention-days: 5
          compression-level: 0

  publish:
    name: Publish images to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-and-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download scanned images
        uses: actions/download-artifact@v8.0.2
        with:
          name: scanned-container-images
          path: ${{ runner.temp }}/scanned-images

      - name: Load scanned images
        run: docker load --input "$RUNNER_TEMP/scanned-images/images.tar"

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push backend image
        env:
          IMAGE: ghcr.io/trgcghai/manga-reader-backend
          SHA_TAG: ${{ github.sha }}
        run: |
          docker tag "local/manga-reader-backend:${SHA_TAG}" "${IMAGE}:${SHA_TAG}"
          docker tag "local/manga-reader-backend:${SHA_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"

      - name: Tag and push frontend image
        env:
          IMAGE: ghcr.io/trgcghai/manga-reader-frontend
          SHA_TAG: ${{ github.sha }}
        run: |
          docker tag "local/manga-reader-frontend:${SHA_TAG}" "${IMAGE}:${SHA_TAG}"
          docker tag "local/manga-reader-frontend:${SHA_TAG}" "${IMAGE}:latest"
          docker push "${IMAGE}:${SHA_TAG}"
          docker push "${IMAGE}:latest"
